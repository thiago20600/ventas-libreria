services:
  ms-agendas:
    build: ./ms-agendas
    env_file:
      - ./ms-agendas/.env
    volumes:
      - ./ms-agendas:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      agendas-db:
        condition: service_healthy
    networks:
      - backend-network
      - db-network

  agendas-db:
    image: postgres:18.7-alpine
    volumes:
      - agendas_postgres_data:/var/lib/postgresql
    env_file:
      - ./ms-agendas/.env
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - edge-network
      - auth-network

  gateway:
    image: kong:3.9.5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - edge-network
      - auth-network
      - backend-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev
    environment:
      KC_HOSTNAME: https://localhost/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - auth-network
      - keycloak-network

  keycloak_db:
    image: postgres:18.7-alpine
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  keycloak_postgres_data:
  agendas_postgres_data:

networks:
  edge-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true
  auth-network:
    driver: bridge
  keycloak-network:
    driver: bridge
    internal: true
  db-network:
    driver: bridge
    internal: true